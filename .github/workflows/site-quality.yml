name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/pwa.js
          node --check service-worker.js
          node --check scripts/smoke-test.mjs
          node --check scripts/seo-validation.mjs
          node --check scripts/pwa-validation.mjs
      - name: Run site smoke tests
        run: node scripts/smoke-test.mjs
      - name: Validate SEO metadata and sitemap
        run: node scripts/seo-validation.mjs
      - name: Validate PWA and service worker
        run: node scripts/pwa-validation.mjs
