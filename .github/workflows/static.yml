# Deploy the static CYBER ARCADIA site to GitHub Pages
# Redeploy Pages after the site was unpublished.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare and verify published site files
        run: |
          mkdir -p /tmp/pages-site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ /tmp/pages-site/
          test -f /tmp/pages-site/googlec9c63ee4851e8e16.html
          test "$(cat /tmp/pages-site/googlec9c63ee4851e8e16.html)" = "google-site-verification: googlec9c63ee4851e8e16.html"
          echo 'Google verification file is present in the Pages publish directory.'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: '/tmp/pages-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
